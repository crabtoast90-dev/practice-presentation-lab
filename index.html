<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Presentation Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%224%22 y=%222%22 width=%228%22 height=%2212%22 rx=%221%22 fill=%22none%22 stroke=%22%23e8b04a%22 stroke-width=%222%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="size-card">
    <!-- Backdrops: a card table for CARD size, a gacha lobby for SHOWCASE -->
    <div id="backdrop"></div>

    <!-- Mock card hand (CARD size) / full-screen lobby (SHOWCASE); the format draws into #slot -->
    <main id="stage">
      <div id="hand">
        <div class="card-back"></div>
        <div class="card-back"></div>
        <div id="slot"><div id="slot-art"></div><div id="nameplate"><b id="hero-name"></b><span id="hero-title"></span></div></div>
        <div class="card-back"></div>
        <div class="card-back"></div>
      </div>
      <div id="lobby-ui" aria-hidden="true">
        <div class="lobby-name"><span id="lobby-title"></span><b id="lobby-name"></b></div>
        <div class="lobby-buttons"><span>Story</span><span>Skins</span><span class="hot">Summon</span></div>
      </div>
      <div id="coming" class="panel" hidden></div>
    </main>

    <!-- Shared controls: tab bar (src/ui/tab-bar.js), hero switch, size toggle (src/ui/size-toggle.js), score (src/ui/score-panel.js) -->
    <header id="bar">
      <nav id="tabs" role="tablist"></nav>
      <div id="controls">
        <div id="heroes" class="seg"></div>
        <div id="sizes" class="seg"></div>
        <button id="score-open" class="chip">Score</button>
      </div>
    </header>

    <aside id="score" class="panel" hidden>
      <div class="score-head">
        <b>Score</b>
        <div id="score-device" class="seg"></div>
        <button id="score-close" class="chip" aria-label="Close">✕</button>
      </div>
      <p class="score-help">Look 1-5 and "would I pay for this as a skin?" for each format and size. Saved in this browser.</p>
      <div id="score-grid"></div>
      <div class="score-foot">
        <button id="score-copy" class="chip">Copy for LOG.md</button>
        <span id="score-copied"></span>
      </div>
      <textarea id="score-text" readonly rows="5"></textarea>
    </aside>

    <p id="loading">Loading…</p>
    <div id="fps" class="panel" hidden></div>
    <div id="credits">Art: Hassaku (SD) · Reveal: Kling 3.0</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
